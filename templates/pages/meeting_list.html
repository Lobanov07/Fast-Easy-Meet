{% extends "base.html" %}
{% block title %}
  встречи
{% endblock %}
{% block content %}
    <!-- templates/meeting_list.html -->
    <h1>Список встреч</h1>
    <ul>
      {% for meeting in meetings %}
        <li><a href="{% url 'pages:meeting_detail' meeting.unique_code %}">{{ meeting.title }}</a></li>
      {% endfor %}
    </ul>
    <a href="{% url 'pages:meeting_create' %}">Создать новую встречу</a>
{% endblock %}
