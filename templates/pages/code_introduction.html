{% extends 'base.html' %}

{% block title %}Присоединение к встрече{% endblock %}

{% block content %}
<style> 
.join-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
}

.header-block {
    background-color: #a6d6f7;
    padding: 20px;
    border-radius: 10px 10px 0 0;
    color: white;
}

.dark-text {
    color: #333; 
}

.form-block {
    margin-top: 20px;
    text-align: left;
}

.input-field {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-top: 10px;
    box-sizing: border-box;
}

.join-button-block {
    margin-top: 20px;
    text-align: center;
}

.join-btn, .join-btn-non-aut {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
}

.join-btn {
    background-color: #4CAF50;
    color: white;
}

.join-btn:hover {
    background-color: #45a049;
}

.join-btn-non-aut {
    background-color: #dc3545;
    color: white;
}

.join-btn-non-aut:hover {
    background-color: #c82333;
}
</style>

<div class="join-container">
    <div class="header-block">
        <h1 class="dark-text">Присоединение к встрече</h1>
    </div>

    <div class="form-block">
        <form id="join-form">
            {% csrf_token %}
            <h4><strong>Введите код встречи:</strong></h4>
            <input type="text" placeholder="*код встречи*" class="input-field" id="meeting-code">
        </form>
    </div>
    {% if user.is_authenticated %}
        <div class="join-button-block">
            <button class="join-btn">Присоединиться к встрече</button>
        </div>
    {% else %}
        <div class="join-button-block">
            <button class="join-btn-non-aut">Войдите в профиль</button>
        </div>
    {% endif %}
</div>

<script>
        document.querySelector('.join-btn-non-aut').addEventListener('click', function() {
        window.location.href = "{% url 'login' %}"; 
    });
</script>
<script>
    document.querySelector('.join-btn').addEventListener('click', function() {
        const meetingCode = document.getElementById('meeting-code').value;

        fetch("{% url 'pages:join_meeting' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: `meeting_code=${encodeURIComponent(meetingCode)}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                window.location.href = "/meetings/";
            } else {
                alert(data.message);
            }
        })
        .catch(error => {
            console.error("Ошибка:", error);
            alert("Произошла ошибка. Попробуйте еще раз.");
        });
    });
</script>
{% endblock %}
