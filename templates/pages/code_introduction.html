{% extends 'base.html' %}

{% block title %}Присоединение к встрече{% endblock %}

{% block content %}
<style> 
.join-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
}

.header-block {
    background-color: #a6d6f7;
    padding: 20px;
    border-radius: 10px 10px 0 0;
    color: white;
}

.dark-text {
    color: #333; /* Темный цвет текста */
}

.form-block {
    margin-top: 20px;
    text-align: left;
}

.input-field {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-top: 10px;
    box-sizing: border-box;
}

.join-button-block {
    margin-top: 20px;
    text-align: center;
}

.join-btn {
    background-color: #4CAF50;
    color: white;
    padding: 10px 169px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
}

.join-btn:hover {
    background-color: #45a049;
}
</style>

<div class="join-container">
    <!-- Заголовок -->
    <div class="header-block">
        <h1 class="dark-text">Присоединение к встрече</h1>
    </div>

    <!-- Форма ввода кода встречи -->
    <div class="form-block">
        <h4><strong>Введите код встречи:</strong></h4>
        <input type="text" placeholder="*код встречи*" class="input-field" id="meeting-code">
    </div>

    <!-- Кнопка присоединиться -->
    <div class="join-button-block">
        <button class="join-btn">Присоединиться к встрече</button>
    </div>
</div>

<!-- Скрипт для обработки кнопки -->
<script>
    document.querySelector('.join-btn').addEventListener('click', function() {
        // Перенаправление на другую страницу
        window.location.href = 'http://127.0.0.1:8000'; // Замените '/meeting-details/' на ваш путь
    });
</script>

{% endblock %}
