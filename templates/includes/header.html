{% load static %}
<header>
  <nav class="navbar navbar-light" style="background-color: SkyBlue">
    <div class="container">
      <a class="navbar-brand" href="{% url 'pages:index' %}">
        <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
        FAST-EASY-MEET
      </a>
      {% with request.resolver_match.view_name as view_name %}
        <ul class="nav  nav-pills">
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'pages:about' %} text-white {% endif %}" href="{% url 'pages:about' %}">
              О проекте
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'pages:rules' %} text-white {% endif %}" href="{% url 'pages:rules' %}">
              Правила
            </a>
          </li>

          {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'pages:profile' %} text-white {% endif %}" href="{% url 'pages:profile' user.username%}">
              Профиль
            </a>
          </li>
          {% endif %}

          {% if user.is_authenticated %}
            <div class="btn-group" role="group" aria-label="Basic outlined example">
              <form action="{% url 'logout' %}" target="_self">
              <button class="btn btn-outline-primary">Выйти</button>
              </form>
            </div>
          {% else %}
            <div class="btn-group" role="group" aria-label="Basic outlined example">
              <form action="{% url 'login' %}" target="_self">
              <button class="btn btn-outline-primary">Войти</button>
              </form>
              <form action="{% url 'registration' %}" target="_self">
              <button class="btn btn-outline-primary">Регистрация</button>
              </form>
            </div>
          {% endif %}
        </ul>
      {% endwith %}
    </div>
  </nav>
</header>
